[build]
  command = "CI=false npm run build"
  publish = "build"

# Redirect all paths to index.html (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (mirrors public/_headers for visibility; Netlify merges)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.airscale.dev https://api.airscale.io; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:"

# Caching for static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
